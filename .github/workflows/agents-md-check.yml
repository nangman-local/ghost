name: AGENTS.md 확인

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: AGENTS.md 갱신 여부
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경된 폴더 확인
        id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "## 변경된 파일" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$CHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # PR 본문에 면제 사유가 적혀 있으면 통과
          if printf '%s' "$BODY" | grep -qiE '문서 변경이? 불필요|no-docs-needed'; then
            echo "면제 사유가 PR 본문에 있어 통과합니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          FAIL=0
          for DIR in android desktop server web; do
            # 해당 폴더에 코드 변경이 있는지 (AGENTS.md 자신은 제외)
            CODE=$(echo "$CHANGED" | grep "^$DIR/" | grep -v "^$DIR/AGENTS.md$" || true)
            [ -z "$CODE" ] && continue

            if echo "$CHANGED" | grep -q "^$DIR/AGENTS.md$"; then
              echo "OK  $DIR/ — AGENTS.md 함께 갱신됨" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$DIR/ 코드를 바꿨지만 $DIR/AGENTS.md 를 갱신하지 않았습니다."
              echo "FAIL  **$DIR/** — 코드는 바뀌었는데 \`$DIR/AGENTS.md\` 가 그대로입니다" >> "$GITHUB_STEP_SUMMARY"
              FAIL=1
            fi
          done

          # shared/ 변경은 루트 AGENTS.md 또는 공지 확인
          SHARED=$(echo "$CHANGED" | grep "^shared/" || true)
          if [ -n "$SHARED" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "NOTE  \`shared/\` 가 바뀌었습니다. **팀 공유 채널 공지**와 세 클라이언트 동시 갱신을 확인하세요." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FAIL" = "1" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "---" >> "$GITHUB_STEP_SUMMARY"
            echo "새로 알게 된 제약·결정사항을 해당 \`AGENTS.md\` 에 적어주세요." >> "$GITHUB_STEP_SUMMARY"
            echo "문서 변경이 정말 불필요하면 PR 본문에 **문서 변경이 불필요한 이유**를 적으면 통과합니다." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "통과." >> "$GITHUB_STEP_SUMMARY"
